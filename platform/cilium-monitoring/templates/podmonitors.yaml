# Scrape configuration for Cilium, which is rendered from the shared cilium/ directory (apps/templates/cilium.yaml).
# The metrics ports and Grafana dashboards are enabled in cilium/values.yaml; the scrape side lives here because
# the Ansible bootstrap installs Cilium before the Prometheus Operator CRDs exist, so the chart's ServiceMonitors
# cannot be used. PodMonitors select the pods directly: the agent and operator have no metrics Service.
# kube-prometheus-stack's Prometheus selects every PodMonitor in every namespace.
# The chart's dashboards select series by pod label (k8s_app="cilium", io_cilium_app="operator"), so the
# PodMonitors copy those labels onto the targets (podTargetLabels).
{{- define "cilium-monitoring.endpoint" -}}
- port: {{ .port }}
  interval: 30s
  relabelings:
    - targetLabel: cluster
      replacement: {{ .cluster | quote }}
    - sourceLabels: [__meta_kubernetes_pod_node_name]
      targetLabel: node
{{- end }}
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: cilium-agent
spec:
  selector:
    matchLabels:
      k8s-app: cilium
  podTargetLabels:
    - k8s-app
    - io.cilium/app
  podMetricsEndpoints:
    {{- include "cilium-monitoring.endpoint" (dict "port" "prometheus" "cluster" .Values.cluster) | nindent 4 }}
    {{- include "cilium-monitoring.endpoint" (dict "port" "hubble-metrics" "cluster" .Values.cluster) | nindent 4 }}
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: cilium-operator
spec:
  selector:
    matchLabels:
      io.cilium/app: operator
  podTargetLabels:
    - k8s-app
    - io.cilium/app
  podMetricsEndpoints:
    {{- include "cilium-monitoring.endpoint" (dict "port" "prometheus" "cluster" .Values.cluster) | nindent 4 }}
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: cilium-envoy
spec:
  selector:
    matchLabels:
      k8s-app: cilium-envoy
  podTargetLabels:
    - k8s-app
    - io.cilium/app
  podMetricsEndpoints:
    {{- include "cilium-monitoring.endpoint" (dict "port" "envoy-metrics" "cluster" .Values.cluster) | nindent 4 }}
