apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: cilium-operator
  namespace: kube-system
spec:
  selector:
    matchLabels:
      io.cilium/app: operator
  podTargetLabels:
    - k8s-app
    - io.cilium/app
  podMetricsEndpoints:
    - port: prometheus
      interval: 30s
      relabelings:
        - targetLabel: cluster
          replacement: "lab"
        - sourceLabels: [__meta_kubernetes_pod_node_name]
          targetLabel: node
