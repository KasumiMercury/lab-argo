apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: cilium-envoy
  namespace: kube-system
spec:
  selector:
    matchLabels:
      k8s-app: cilium-envoy
  podTargetLabels:
    - k8s-app
    - io.cilium/app
  podMetricsEndpoints:
    - port: envoy-metrics
      interval: 30s
      relabelings:
        - targetLabel: cluster
          replacement: "lab"
        - sourceLabels: [__meta_kubernetes_pod_node_name]
          targetLabel: node
