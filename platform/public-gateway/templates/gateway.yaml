# Entry point for services published on the internet. A service is published by an HTTPRoute in its own
# namespace, which must carry the label {{ .Values.allowedRoutesLabel }}=true, that names its hostname and this Gateway:
#   parentRefs: [{name: public, namespace: public-gateway}]
#   hostnames: [foo.mercuryksm.net]
# external-dns then creates the proxied CNAME foo.mercuryksm.net -> <tunnel>.cfargotunnel.com.
# TLS is terminated by Cloudflare; cloudflared forwards every hostname here over plain HTTP.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: public
  {{- if .Values.tunnelID }}
  annotations:
    external-dns.kubernetes.io/target: {{ .Values.tunnelID }}.cfargotunnel.com
  {{- end }}
spec:
  gatewayClassName: cilium
  infrastructure:
    parametersRef:
      group: cilium.io
      kind: CiliumGatewayClassConfig
      name: public
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              {{ .Values.allowedRoutesLabel }}: "true"
---
# cloudflared is the only intended client. Without NodePorts the Service is not reachable from the LAN on
# every node's address, which would bypass Cloudflare.
apiVersion: cilium.io/v2alpha1
kind: CiliumGatewayClassConfig
metadata:
  name: public
spec:
  service:
    type: LoadBalancer
    allocateLoadBalancerNodePorts: false
