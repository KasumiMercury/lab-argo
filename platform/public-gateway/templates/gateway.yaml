# Entry point for services published on the internet. A service is published by an HTTPRoute in its own
# namespace that names its hostname and this Gateway:
#   parentRefs: [{name: public, namespace: public-gateway}]
#   hostnames: [foo.mercuryksm.net]
# external-dns then creates the proxied CNAME foo.mercuryksm.net -> <tunnel>.cfargotunnel.com.
# TLS is terminated by Cloudflare; cloudflared forwards every hostname here over plain HTTP.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: public
  {{- if .Values.tunnelID }}
  annotations:
    external-dns.alpha.kubernetes.io/target: {{ .Values.tunnelID }}.cfargotunnel.com
  {{- end }}
spec:
  gatewayClassName: cilium
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
