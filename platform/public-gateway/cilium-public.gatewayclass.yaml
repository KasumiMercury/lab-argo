# cloudflared is the only intended client. Without NodePorts the Service is not reachable from the LAN on
# every node's address, which would bypass Cloudflare. Cilium reads this only from a GatewayClass
# (a Gateway's spec.infrastructure.parametersRef is rejected as unsupported).
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: cilium-public
spec:
  controllerName: io.cilium/gateway-controller
  parametersRef:
    group: cilium.io
    kind: CiliumGatewayClassConfig
    name: public
    namespace: public-gateway
