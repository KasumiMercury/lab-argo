kube-prometheus-stack:
  # MicroK8s runs the control plane inside kubelite: the controller-manager and scheduler bind to
  # localhost, there is no etcd (dqlite), and kube-proxy is replaced by Cilium. Scraping them would only
  # produce "target down" alerts.
  kubeControllerManager:
    enabled: false
  kubeScheduler:
    enabled: false
  kubeEtcd:
    enabled: false
  kubeProxy:
    enabled: false

  # kubelite is one process with one metrics registry, so on the control-plane node the apiserver (:16443)
  # and the kubelet (:10250) serve the same /metrics: every apiserver, scheduler and controller-manager
  # series also arrived as job="kubelet" and every kubelet series as job="apiserver". Each job keeps only its
  # own families; go_/process_/rest_client_/workqueue_ stay in both because each job's dashboards use them.
  # The lists replace the chart's defaults, which are repeated first.
  kubeApiServer:
    serviceMonitor:
      metricRelabelings:
        # Chart default: drop excessively noisy apiserver buckets
        - action: drop
          regex: (etcd_request|apiserver_request_slo|apiserver_request_sli|apiserver_request)_duration_seconds_bucket;(0\.15|0\.2|0\.3|0\.35|0\.4|0\.45|0\.6|0\.7|0\.8|0\.9|1\.25|1\.5|1\.75|2|3|3\.5|4|4\.5|6|7|8|9|15|20|40|45|50)(\.0)?
          sourceLabels: [__name__, le]
        # The kubelet's families (scraped as job="kubelet" on every node)
        - action: drop
          regex: (kubelet|csi|dra|storage_operation|volume_manager|volume_operation|plugin_manager|reconstruct_volume|force_cleaned_failed_volume)_.+
          sourceLabels: [__name__]
  kubelet:
    serviceMonitor:
      # /metrics only; cAdvisor and probes have their own lists
      metricRelabelings:
        # Chart default: reduce bucket cardinality of kubelet storage operations
        - action: drop
          sourceLabels: [__name__, le]
          regex: (csi_operations|storage_operation_duration)_seconds_bucket;(0.25|2.5|15|25|120|600)(\.0)?
        # The families of the kubelet's own registry (what a worker node serves)
        - action: keep
          sourceLabels: [__name__]
          regex: (kubelet|csi|dra|storage_operation|volume_manager|volume_operation|plugin_manager|reconstruct_volume|force_cleaned_failed_volume|go|process|rest_client|workqueue)_.+|kubernetes_build_info|kubernetes_feature_enabled

  prometheus:
    prometheusSpec:
      # Pick up ServiceMonitors/PodMonitors/rules from every Application, not only this release
      serviceMonitorSelectorNilUsesHelmValues: false
      podMonitorSelectorNilUsesHelmValues: false
      ruleSelectorNilUsesHelmValues: false
      probeSelectorNilUsesHelmValues: false
      retention: 15d
      retentionSize: 18GB
      storageSpec:
        volumeClaimTemplate:
          spec:
            storageClassName: nfs-csi
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 20Gi

  # Slack #k8s-alert gets the alerts of the Loki ruler (notify="k8s-alert", platform/loki/rules/k8s-alerts.yaml)
  # and every warning or critical alert of Prometheus: the stack's default rules and the PrometheusRules of
  # the Applications (CouchDB, ...). Info alerts (CPUThrottlingHigh, KubeQuotaAlmostFull, ...) and the
  # always-firing Watchdog/InfoInhibitor go nowhere. Posted through the Slack App shared with pve-grafana and
  # Zabbix (lab-proxmox, scope chat:write; invite the bot to the channel); its bot token is the Secret
  # alertmanager-slack (task seal:slack), mounted at /etc/alertmanager/secrets/alertmanager-slack/.
  alertmanager:
    alertmanagerSpec:
      secrets:
        - alertmanager-slack
    config:
      route:
        group_by: [alertname, namespace, node, container]
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 4h
        receiver: "null"
        routes:
          - matchers:
              - alertname =~ "Watchdog|InfoInhibitor"
            receiver: "null"
          - matchers:
              - notify = "k8s-alert"
            receiver: slack-k8s-alert
          - matchers:
              - severity =~ "warning|critical"
            receiver: slack-k8s-alert
      receivers:
        - name: "null"
        - name: slack-k8s-alert
          slack_configs:
            # Bot token through http_config: app_token_file together with update_message makes
            # Alertmanager v0.34.1 panic while loading the configuration
            - api_url: https://slack.com/api/chat.postMessage
              http_config:
                authorization:
                  type: Bearer
                  credentials_file: /etc/alertmanager/secrets/alertmanager-slack/bot-token
              channel: "#k8s-alert"
              send_resolved: true
              # Resolving edits the original message instead of posting a new one
              update_message: true
              color: '{{ if eq .Status "firing" }}danger{{ else }}good{{ end }}'
              title: '[{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] {{ .CommonLabels.alertname }}'
              # Loki rules link the logs dashboard, Prometheus rules their runbook
              title_link: '{{ with (index .Alerts 0).Annotations.dashboard }}{{ . }}{{ else }}{{ (index .Alerts 0).Annotations.runbook_url }}{{ end }}'
              text: |-
                {{ range .Alerts }}*{{ with .Annotations.summary }}{{ . }}{{ else }}{{ .Labels.alertname }}{{ end }}*{{ with .Labels.namespace }} (`{{ . }}`){{ end }}
                {{ with .Annotations.description }}{{ . }}{{ else }}{{ .Annotations.message }}{{ end }}
                {{ end }}

  grafana:
    admin:
      # Delivered by templates/grafana-admin.sealedsecret.yaml (task seal:grafana)
      existingSecret: grafana-admin
      userKey: admin-user
      passwordKey: admin-password
    # Reachable on the tailnet as https://grafana.<tailnet>.ts.net
    ingress:
      enabled: true
      ingressClassName: tailscale
      hosts: []
      path: /
      tls:
        - hosts:
            - grafana
    # Pod logs and Kubernetes events collected by Alloy (platform/alloy) into Loki (platform/loki)
    additionalDataSources:
      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://loki.logging.svc:3100
        jsonData:
          maxLines: 1000
