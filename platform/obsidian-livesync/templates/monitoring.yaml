# Monitoring for CouchDB: scraped by kube-prometheus-stack (its Prometheus selects every ServiceMonitor and
# PrometheusRule), dashboard loaded by the Grafana sidecar (grafana_dashboard label, all namespaces).
# Running out of space on the volume is covered by KubePersistentVolumeFillingUp and restarts by
# KubePodCrashLooping from the stack's default rules.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: couchdb
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: couchdb
  endpoints:
    - port: metrics
      path: /_node/_local/_prometheus
      interval: 30s
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: couchdb
spec:
  groups:
    - name: couchdb
      rules:
        - alert: CouchDBDown
          # absent() also fires when the Pod or its target is gone altogether
          expr: absent(up{namespace="{{ .Release.Namespace }}", service="couchdb"} == 1)
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: CouchDB for Obsidian LiveSync is down
            description: Prometheus has not scraped CouchDB in {{ .Release.Namespace }} for 5 minutes; LiveSync clients cannot sync.
        - alert: CouchDBServerErrors
          expr: |
            sum(rate(couchdb_httpd_status_codes{namespace="{{ .Release.Namespace }}", code=~"5.."}[10m]))
              / sum(rate(couchdb_httpd_status_codes{namespace="{{ .Release.Namespace }}"}[10m])) > 0.05
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: CouchDB answers more than 5% of requests with 5xx
            description: "{{`{{ $value | humanizePercentage }}`}} of CouchDB requests in {{ .Release.Namespace }} failed with a 5xx status over the last 10 minutes."
        - alert: CouchDBReplicationJobsCrashed
          expr: couchdb_couch_replicator_jobs_crashed{namespace="{{ .Release.Namespace }}"} > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: CouchDB replication jobs keep crashing
            description: "{{`{{ $value }}`}} replication job(s) in {{ .Release.Namespace }} are in the crashed state (check /_scheduler/jobs)."
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: couchdb-dashboard
  labels:
    grafana_dashboard: "1"
data:
  couchdb.json: |-
{{ .Files.Get "dashboards/couchdb.json" | indent 4 }}
