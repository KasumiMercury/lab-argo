csi-driver-nfs:
  # MicroK8s runs the kubelet from the snap, not /var/lib/kubelet
  kubeletDir: /var/snap/microk8s/common/var/lib/kubelet
  storageClass:
    create: true
    name: nfs-csi
    annotations:
      storageclass.kubernetes.io/is-default-class: "true"
    parameters:
      # Proxmox storage "strix0" (same export that Proxmox mounts at /mnt/pve/strix0)
      server: 192.168.110.5
      share: /nfs/proxmox
      # Keep Kubernetes volumes in their own directory next to the Proxmox content
      subDir: k8s/${pvc.metadata.namespace}-${pvc.metadata.name}-${pv.metadata.name}
    reclaimPolicy: Delete
    volumeBindingMode: Immediate
    allowVolumeExpansion: true
