csi-driver-nfs:
  # MicroK8s runs the kubelet from the snap, not /var/lib/kubelet
  kubeletDir: /var/snap/microk8s/common/var/lib/kubelet
  storageClass:
    create: true
    name: nfs-csi
    annotations:
      storageclass.kubernetes.io/is-default-class: "true"
    parameters:
      # NAS export dedicated to Kubernetes (allowed for the k8s VM subnet 192.168.110.0/24).
      # Proxmox's strix0 (/nfs/proxmox) is exported to 192.168.20.0/24 only, so the VMs cannot mount it.
      server: 192.168.110.5
      share: /nfs/k8s
      subDir: ${pvc.metadata.namespace}-${pvc.metadata.name}-${pv.metadata.name}
    reclaimPolicy: Delete
    volumeBindingMode: Immediate
    allowVolumeExpansion: true
  # VolumeSnapshot CRDs and controller come from the snapshot-controller component
  volumeSnapshotClass:
    create: true
    name: nfs-csi
    annotations:
      snapshot.storage.kubernetes.io/is-default-class: "true"
    deletionPolicy: Delete
