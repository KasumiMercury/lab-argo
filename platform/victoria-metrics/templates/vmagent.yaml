apiVersion: operator.victoriametrics.com/v1beta1
kind: VMAgent
metadata:
  name: k8s
spec:
  selectAllByDefault: true
  scrapeInterval: 30s
  remoteWrite:
    - url: http://vmsingle-k8s.{{ .Release.Namespace }}.svc:8428/api/v1/write
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 512Mi
---
apiVersion: v1
kind: Secret
metadata:
  name: vmagent-k8s-token
  annotations:
    kubernetes.io/service-account.name: vmagent-k8s
type: kubernetes.io/service-account-token
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMStaticScrape
metadata:
  name: kube-etcd
spec:
  jobName: kube-etcd
  targetEndpoints:
    - targets:
        - 192.168.110.181:2381
