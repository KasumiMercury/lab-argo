argo-cd:
  configs:
    params:
      # TLS is terminated by the Tailscale proxy (templates/server-ingress.yaml), so argocd-server speaks plain HTTP.
      # Keep in step with argocd_helm_values in lab-proxmox (ansible/roles/argocd/defaults/main.yml)
      server.insecure: true
    cm:
      # Report Application health so that sync waves in the app-of-apps wait for each component.
      # https://argo-cd.readthedocs.io/en/stable/operator-manual/health/#argocd-app
      resource.customizations.health.argoproj.io_Application: |
        hs = {}
        hs.status = "Progressing"
        hs.message = ""
        if obj.status ~= nil then
          if obj.status.health ~= nil then
            hs.status = obj.status.health.status
            if obj.status.health.message ~= nil then
              hs.message = obj.status.health.message
            end
          end
        end
        return hs
    # CiliumIdentity/CiliumEndpoint are already in the chart's default resource.exclusions
