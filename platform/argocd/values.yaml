argo-cd:
  configs:
    params:
      # TLS is terminated by the Tailscale proxy (templates/server-ingress.yaml), so argocd-server speaks plain HTTP.
      # Keep in step with argocd_helm_values in lab-proxmox (ansible/roles/argocd/defaults/main.yml)
      server.insecure: true
    cm:
      # Dex's callback URL is built from this: register https://argocd.tail4a681d.ts.net/api/dex/callback as the
      # GitHub OAuth App's callback
      url: https://argocd.tail4a681d.ts.net
      # Log in with GitHub through the bundled Dex. The client comes from the sealed argocd-dex-github Secret
      # (task seal:argocd-github). Any GitHub account can authenticate; RBAC below grants roles by login.
      dex.config: |
        connectors:
          - type: github
            id: github
            name: GitHub
            config:
              clientID: $argocd-dex-github:clientID
              clientSecret: $argocd-dex-github:clientSecret
      # GitHub (Dex) is the only login; the local admin account is off
      admin.enabled: false
      # Report Application health so that sync waves in the app-of-apps wait for each component.
      # https://argo-cd.readthedocs.io/en/stable/operator-manual/health/#argocd-app
      resource.customizations.health.argoproj.io_Application: |
        hs = {}
        hs.status = "Progressing"
        hs.message = ""
        if obj.status ~= nil then
          if obj.status.health ~= nil then
            hs.status = obj.status.health.status
            if obj.status.health.message ~= nil then
              hs.message = obj.status.health.message
            end
          end
        end
        return hs
    # CiliumIdentity/CiliumEndpoint are already in the chart's default resource.exclusions
    rbac:
      # Only these GitHub users get a role; everyone else who authenticates sees nothing.
      # The subject is Dex's federated_claims.user_id, which the GitHub connector sets to the numeric user ID
      # (gh api users/<login> -q .id). Unlike the login or email, it cannot be changed or taken over.
      policy.default: ""
      policy.csv: |
        g, 88318012, role:admin

  # From the observed peaks (application-controller ~840Mi, repo-server ~200Mi while rendering)
  controller:
    resources:
      requests:
        cpu: 50m
        memory: 1Gi
      limits:
        memory: 1536Mi
  repoServer:
    resources:
      requests:
        cpu: 20m
        memory: 256Mi
      limits:
        memory: 512Mi
  server:
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 128Mi
  dex:
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 128Mi
  redis:
    resources:
      requests:
        cpu: 10m
        memory: 48Mi
      limits:
        memory: 96Mi
  notifications:
    resources:
      requests:
        cpu: 10m
        memory: 48Mi
      limits:
        memory: 96Mi
  applicationSet:
    resources:
      requests:
        cpu: 10m
        memory: 48Mi
      limits:
        memory: 96Mi
