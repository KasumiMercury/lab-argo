# csi-provisioner v6.3.0 (sidecar of the ceph-csi-rbd 3.18.1 chart) watches VolumeSnapshots to protect the ones
# used as a PVC data source with a finalizer and to sweep orphaned finalizers. The chart's ClusterRole only
# grants get/list/patch, so the watch fails every few seconds ("cannot watch resource volumesnapshots").
# Grants the verbs of the upstream RBAC (kubernetes-csi/external-provisioner deploy/kubernetes/rbac.yaml).
# Drop this once the chart's ClusterRole includes them.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-provisioner-snapshot-protection
rules:
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshots"]
    verbs: ["get", "list", "watch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-provisioner-snapshot-protection
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Name }}-provisioner-snapshot-protection
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-provisioner
    namespace: {{ .Release.Namespace }}
