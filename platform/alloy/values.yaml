# One Alloy instance reads the logs of every Pod through the Kubernetes API (kubelet log endpoint) and
# watches cluster events, then pushes both to Loki. Reading through the API needs no hostPath mounts (the
# MicroK8s kubelet lives under the snap) and keeps events from being collected once per node, which a
# DaemonSet would do. Logs written while Alloy is down are read back from its last position on restart.
alloy:
  controller:
    type: deployment
    replicas: 1

  alloy:
    # Usage statistics to grafana.com
    enableReporting: false
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 512Mi
    configMap:
      content: |
        logging {
          level  = "info"
          format = "logfmt"
        }

        // Pod logs -----------------------------------------------------------

        discovery.kubernetes "pods" {
          role = "pod"
        }

        discovery.relabel "pods" {
          targets = discovery.kubernetes.pods.targets

          // Completed Pods have nothing left to tail
          rule {
            source_labels = ["__meta_kubernetes_pod_phase"]
            regex         = "Succeeded|Failed"
            action        = "drop"
          }
          rule {
            source_labels = ["__meta_kubernetes_namespace"]
            target_label  = "namespace"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_name"]
            target_label  = "pod"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_container_name"]
            target_label  = "container"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_node_name"]
            target_label  = "node"
          }
          // app: app.kubernetes.io/name, else the k8s-app or app label
          rule {
            source_labels = [
              "__meta_kubernetes_pod_label_app_kubernetes_io_name",
              "__meta_kubernetes_pod_label_k8s_app",
              "__meta_kubernetes_pod_label_app",
            ]
            regex        = "^;*([^;]+)(;.*)?$"
            target_label = "app"
          }
          rule {
            source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_container_name"]
            separator     = "/"
            target_label  = "job"
          }
        }

        loki.source.kubernetes "pods" {
          targets    = discovery.relabel.pods.output
          forward_to = [loki.process.drop_noise.receiver]
        }

        // Recurring error/warn lines that never need action; they would keep the dashboard's
        // error and warning counts above zero. Each rule is limited to one container and one message.
        loki.process "drop_noise" {
          // Argo CD renders a new revision once without charts/ (gitignored), then builds the
          // dependencies itself and renders again
          stage.match {
            selector            = "{namespace=\"argocd\", container=\"repo-server\"} |= \"but missing in charts/ directory\""
            action              = "drop"
            drop_counter_reason = "argocd_missing_chart_deps"
          }
          // Queries cancelled by the browser (dashboard refresh, variable change) are logged on
          // every hop: Grafana's datasource plugins, Loki's querier and the tailscale proxy
          stage.match {
            selector            = "{namespace=\"monitoring\", container=\"grafana\"} |= \"context canceled\""
            action              = "drop"
            drop_counter_reason = "query_cancelled"
          }
          stage.match {
            selector            = "{namespace=\"logging\", container=\"loki\"} |~ \"context canceled|error notifying scheduler about finished query|error health checking\""
            action              = "drop"
            drop_counter_reason = "query_cancelled"
          }
          stage.match {
            selector            = "{namespace=\"tailscale\"} |= \"http: proxy error: context canceled\""
            action              = "drop"
            drop_counter_reason = "query_cancelled"
          }
          // Tailnet clients going away during the TLS handshake. CreateEndpoint (TCP handshake)
          // timeouts are kept: they come from clients reaching the proxies only through DERP.
          stage.match {
            selector            = "{namespace=\"tailscale\"} |= \"http: TLS handshake error\""
            action              = "drop"
            drop_counter_reason = "client_connection_reset"
          }
          // Routine session token rotation, HEAD requests for plugin modules, and the per-request
          // summary of a failed datasource query (its cause is logged on a separate line with error=)
          stage.match {
            selector            = "{namespace=\"monitoring\", container=\"grafana\"} |~ \"token needs to be rotated|Failed to write gzipped response|Plugin Request Completed\""
            action              = "drop"
            drop_counter_reason = "grafana_routine"
          }

          forward_to = [loki.process.klog_level.receiver]
        }

        // klog lines (I/W/E/F + MMDD prefix) get their level from the prefix. Loki's own level detection
        // ignores the prefix and calls a warning "error" whenever the message contains that word.
        loki.process "klog_level" {
          stage.match {
            selector = "{namespace=~\".+\"} |~ \"^I[0-9]{4} \""
            stage.static_labels {
              values = {level = "info"}
            }
          }
          stage.match {
            selector = "{namespace=~\".+\"} |~ \"^W[0-9]{4} \""
            stage.static_labels {
              values = {level = "warn"}
            }
          }
          stage.match {
            selector = "{namespace=~\".+\"} |~ \"^E[0-9]{4} \""
            stage.static_labels {
              values = {level = "error"}
            }
          }
          stage.match {
            selector = "{namespace=~\".+\"} |~ \"^F[0-9]{4} \""
            stage.static_labels {
              values = {level = "fatal"}
            }
          }

          forward_to = [loki.write.default.receiver]
        }

        // Kubernetes events --------------------------------------------------

        loki.source.kubernetes_events "events" {
          job_name   = "kubernetes-events"
          log_format = "logfmt"
          forward_to = [loki.write.default.receiver]
        }

        // Loki ---------------------------------------------------------------

        loki.write "default" {
          endpoint {
            url = "http://loki.logging.svc:3100/loki/api/v1/push"
          }
        }

  # Alloy's own metrics (loki_write_* for dropped or failed pushes)
  serviceMonitor:
    enabled: true
