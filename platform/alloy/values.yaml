# One Alloy instance reads the logs of every Pod through the Kubernetes API (kubelet log endpoint) and
# watches cluster events, then pushes both to Loki. Reading through the API needs no hostPath mounts (the
# MicroK8s kubelet lives under the snap) and keeps events from being collected once per node, which a
# DaemonSet would do. Logs written while Alloy is down are read back from its last position on restart.
alloy:
  controller:
    type: deployment
    replicas: 1

  alloy:
    # Usage statistics to grafana.com
    enableReporting: false
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 512Mi
    configMap:
      content: |
        logging {
          level  = "info"
          format = "logfmt"
        }

        // Pod logs -----------------------------------------------------------

        discovery.kubernetes "pods" {
          role = "pod"
        }

        discovery.relabel "pods" {
          targets = discovery.kubernetes.pods.targets

          // Completed Pods have nothing left to tail
          rule {
            source_labels = ["__meta_kubernetes_pod_phase"]
            regex         = "Succeeded|Failed"
            action        = "drop"
          }
          rule {
            source_labels = ["__meta_kubernetes_namespace"]
            target_label  = "namespace"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_name"]
            target_label  = "pod"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_container_name"]
            target_label  = "container"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_node_name"]
            target_label  = "node"
          }
          // app: app.kubernetes.io/name, else the k8s-app or app label
          rule {
            source_labels = [
              "__meta_kubernetes_pod_label_app_kubernetes_io_name",
              "__meta_kubernetes_pod_label_k8s_app",
              "__meta_kubernetes_pod_label_app",
            ]
            regex        = "^;*([^;]+)(;.*)?$"
            target_label = "app"
          }
          rule {
            source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_container_name"]
            separator     = "/"
            target_label  = "job"
          }
        }

        loki.source.kubernetes "pods" {
          targets    = discovery.relabel.pods.output
          forward_to = [loki.write.default.receiver]
        }

        // Kubernetes events --------------------------------------------------

        loki.source.kubernetes_events "events" {
          job_name   = "kubernetes-events"
          log_format = "logfmt"
          forward_to = [loki.write.default.receiver]
        }

        // Loki ---------------------------------------------------------------

        loki.write "default" {
          endpoint {
            url = "http://loki.logging.svc:3100/loki/api/v1/push"
          }
        }

  # Alloy's own metrics (loki_write_* for dropped or failed pushes)
  serviceMonitor:
    enabled: true
