# Keeps the kustomize pinned in mise.toml at the version Argo CD builds with. A PR that changes the argo-cd chart
# (Renovate's update) gets a commit setting mise.toml to the kustomize of the chart's Argo CD release
# (task check:kustomize). The push uses GITHUB_TOKEN, so it starts no other workflow.
name: kustomize-version

on:
  pull_request:
    paths:
      - platform/argocd/Chart.yaml

permissions:
  contents: write

jobs:
  sync:
    # Only branches of this repository can be pushed to
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
      - uses: jdx/mise-action@v5
        with:
          install_args: helm task yq
      - run: task check:kustomize FIX=true
      - name: Commit mise.toml
        run: |
          git diff --quiet mise.toml && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Match kustomize to the version bundled in Argo CD' mise.toml
          git push
