# https://taskfile.dev

version: '3'

vars:
  # Directory of every component (platform/<name> and services/<name>)
  COMPONENT_DIRS:
    sh: ls -d platform/* services/*
  # Components that are umbrella Helm charts (the others are kustomizations)
  CHART_DIRS:
    sh: find platform services -mindepth 2 -maxdepth 2 -name Chart.yaml -exec dirname {} \; | sort
  # kubeconfig written by the lab-proxmox playbook (override with KUBECONFIG=...)
  KUBECONFIG: '{{.KUBECONFIG | default "../lab-proxmox/ansible/artifacts/k8s.kubeconfig"}}'
  TOLO_SECRET_KEYS: signing-key.pem introspection-client-secret tenant-management-db-password graph-authoring-db-password observation-db-password operation-db-password guest-db-password realtime-db-password jwk-private-key.pem seed-users.json idp-db-password web-auth-db-password web-auth-secret console-ui-client-secret edge-page-client-secret observation-connection-client-secret

env:
  KUBECONFIG: '{{.KUBECONFIG}}'
  # Helm repositories of this project only, apart from the user's global ones (same as mise.toml)
  HELM_REPOSITORY_CONFIG: '{{.ROOT_DIR}}/.helm/repositories.yaml'
  HELM_REPOSITORY_CACHE: '{{.ROOT_DIR}}/.helm/repository'

tasks:
  default:
    cmds:
      - task --list
    silent: true

  repos:
    desc: Register the Helm repositories referenced by the component charts (needed by helm dependency build)
    run: once
    # OCI dependencies need no repository. A URL is registered under one name only: with two names,
    # helm dependency build may resolve it through the one whose index was not refreshed
    cmds:
      - |
        registered=$(helm repo list -o yaml 2>/dev/null | yq '.[].url' || true)
        for chart in $(find platform services -mindepth 2 -maxdepth 2 -name Chart.yaml); do
          yq '.dependencies[] | select(.repository | test("^oci://") | not) | .name + " " + .repository' "$chart"
        done | sort -u | while read -r name url; do
          echo "$registered" | grep -qxF "$url" && continue
          helm repo add "$name" "$url" >/dev/null
          registered="$registered
        $url"
        done

  deps:
    desc: Download the pinned chart dependencies of every component (from Chart.lock)
    deps: [repos]
    cmds:
      - for: { var: CHART_DIRS }
        cmd: helm dependency build {{.ITEM}}

  deps:update:
    desc: Re-resolve dependencies and rewrite Chart.lock after changing a version in Chart.yaml (APP=<component>)
    requires:
      vars: [APP]
    vars:
      DIR:
        sh: find platform services -mindepth 1 -maxdepth 1 -name '{{.APP}}'
    cmds:
      - helm dependency update {{.DIR}}

  render:
    desc: Render a component exactly as Argo CD does (APP=<component>)
    deps: [repos]
    requires:
      vars: [APP]
    vars:
      DIR:
        sh: find platform services -mindepth 1 -maxdepth 1 -name '{{.APP}}'
      RELEASE:
        sh: yq '(.platform, .services) | .["{{.APP}}"] | select(.) | .releaseName' apps/values.yaml
      NAMESPACE:
        sh: yq '(.platform, .services) | .["{{.APP}}"] | select(.) | .namespace' apps/values.yaml
    cmds:
      - |
        if [ -f {{.DIR}}/kustomization.yaml ]; then
          kustomize build {{.DIR}}
        else
          helm dependency build {{.DIR}} >/dev/null
          helm template {{.RELEASE}} {{.DIR}} --namespace {{.NAMESPACE}} --include-crds
        fi

  render:cilium:
    desc: Render Cilium with the pin and values of the shared cilium/ directory
    vars:
      REPO:
        sh: yq .repo cilium/version.yaml
      CHART:
        sh: yq .chart cilium/version.yaml
      VERSION:
        sh: yq .version cilium/version.yaml
    cmds:
      - helm template cilium {{.CHART}} --repo {{.REPO}} --version {{.VERSION}} --namespace kube-system --values cilium/values.yaml

  render:apps:
    desc: Render the Argo CD Applications generated by the root app
    cmds:
      - helm template apps apps

  lint:
    desc: Lint and render every chart to catch errors before pushing
    deps: [repos]
    cmds:
      - task: check:kustomize
      - helm lint apps --quiet
      - helm template apps apps >/dev/null
      - for: { var: COMPONENT_DIRS }
        task: lint:component
        vars:
          APP: '{{base .ITEM}}'
      - task render:cilium >/dev/null
      - task: check:tolo-secrets

  lint:component:
    internal: true
    vars:
      DIR:
        sh: find platform services -mindepth 1 -maxdepth 1 -name '{{.APP}}'
    cmds:
      - |
        if [ ! -f {{.DIR}}/kustomization.yaml ]; then
          helm dependency build {{.DIR}} >/dev/null
          helm lint {{.DIR}} --quiet
        fi
      - task render APP={{.APP}} >/dev/null

  check:kustomize:
    desc: Check that mise.toml pins the kustomize Argo CD builds with (the argo-cd chart's appVersion, then KUSTOMIZE_VERSION in that release's hack/tool-versions.sh); FIX=true rewrites mise.toml
    vars:
      FIX: '{{.FIX | default "false"}}'
    cmds:
      - |
        set -eu
        chart=$(yq '.dependencies[] | select(.name == "argo-cd") | .repository + "/" + .name' platform/argocd/Chart.yaml)
        version=$(yq '.dependencies[] | select(.name == "argo-cd") | .version' platform/argocd/Chart.yaml)
        app=$(helm show chart "$chart" --version "$version" | yq .appVersion)
        want=$(curl -fsSL "https://raw.githubusercontent.com/argoproj/argo-cd/$app/hack/tool-versions.sh" | sed -n 's/^KUSTOMIZE_VERSION=//p')
        [ -n "$want" ] || { echo "no KUSTOMIZE_VERSION in argo-cd $app hack/tool-versions.sh" >&2; exit 1; }
        have=$(sed -n 's/^kustomize = "\(.*\)"$/\1/p' mise.toml)
        if [ "$have" = "$want" ]; then
          echo "kustomize $have matches argo-cd $app (chart $version)"
        elif [ "{{.FIX}}" = true ]; then
          sed -i "s/^kustomize = \".*\"$/kustomize = \"$want\"/" mise.toml
          echo "kustomize $have -> $want in mise.toml (argo-cd $app, chart $version)"
        else
          echo "mise.toml pins kustomize $have, argo-cd $app (chart $version) builds with $want: run task check:kustomize FIX=true" >&2
          exit 1
        fi

  bootstrap:
    desc: Apply the root Application (app-of-apps) to the cluster in KUBECONFIG
    preconditions:
      - sh: test -f "$KUBECONFIG"
        msg: "kubeconfig not found: {{.KUBECONFIG}} (build the cluster with lab-proxmox first, or set KUBECONFIG=...)"
    cmds:
      - echo "applying bootstrap/root.yaml to $(kubectl config view --minify -o jsonpath='{.clusters[0].cluster.server}')"
      - kubectl apply -f bootstrap/root.yaml

  # Secrets are built in memory from environment variables (strenv) and sealed with the cluster's public
  # key, so plaintext never touches the disk or the command line. kubeseal talks to
  # kube-system/sealed-secrets-controller, the name set in platform/sealed-secrets.

  seal:tailscale:
    desc: Seal the Tailscale operator OAuth client (TS_CLIENT_ID / TS_CLIENT_SECRET, prompted when unset)
    interactive: true
    vars:
      OUTPUT: platform/tailscale/templates/operator-oauth.sealedsecret.yaml
    cmds:
      - mkdir -p {{dir .OUTPUT}}
      - |
        [ -n "${TS_CLIENT_ID:-}" ] || { printf 'Tailscale OAuth client ID: '; read -r TS_CLIENT_ID; }
        [ -n "${TS_CLIENT_SECRET:-}" ] || { printf 'Tailscale OAuth client secret: '; stty -echo; read -r TS_CLIENT_SECRET; stty echo; echo; }
        export TS_CLIENT_ID TS_CLIENT_SECRET
        yq -n '.apiVersion = "v1" | .kind = "Secret"
          | .metadata.name = "operator-oauth" | .metadata.namespace = "tailscale"
          | .stringData.client_id = strenv(TS_CLIENT_ID) | .stringData.client_secret = strenv(TS_CLIENT_SECRET)' \
          | kubeseal --format yaml > {{.OUTPUT}}
      - echo "sealed tailscale/operator-oauth -> {{.OUTPUT}}"

  seal:grafana:
    desc: Seal the Grafana admin credentials (GRAFANA_ADMIN_USER default admin, GRAFANA_ADMIN_PASSWORD prompted when unset)
    interactive: true
    vars:
      OUTPUT: platform/kube-prometheus-stack/templates/grafana-admin.sealedsecret.yaml
    cmds:
      - mkdir -p {{dir .OUTPUT}}
      - |
        GRAFANA_ADMIN_USER="${GRAFANA_ADMIN_USER:-admin}"
        [ -n "${GRAFANA_ADMIN_PASSWORD:-}" ] || { printf 'Grafana admin password: '; stty -echo; read -r GRAFANA_ADMIN_PASSWORD; stty echo; echo; }
        export GRAFANA_ADMIN_USER GRAFANA_ADMIN_PASSWORD
        yq -n '.apiVersion = "v1" | .kind = "Secret"
          | .metadata.name = "grafana-admin" | .metadata.namespace = "monitoring"
          | .stringData.admin-user = strenv(GRAFANA_ADMIN_USER) | .stringData.admin-password = strenv(GRAFANA_ADMIN_PASSWORD)' \
          | kubeseal --format yaml > {{.OUTPUT}}
      - echo "sealed monitoring/grafana-admin -> {{.OUTPUT}}"

  seal:grafana-github:
    desc: Seal the GitHub OAuth App Grafana logs in with (GITHUB_CLIENT_ID / GITHUB_CLIENT_SECRET, prompted when unset; callback https://grafana.<tailnet>.ts.net/login/github)
    interactive: true
    vars:
      OUTPUT: platform/kube-prometheus-stack/templates/grafana-github.sealedsecret.yaml
    cmds:
      - mkdir -p {{dir .OUTPUT}}
      - |
        [ -n "${GITHUB_CLIENT_ID:-}" ] || { printf 'GitHub OAuth client ID: '; read -r GITHUB_CLIENT_ID; }
        [ -n "${GITHUB_CLIENT_SECRET:-}" ] || { printf 'GitHub OAuth client secret: '; stty -echo; read -r GITHUB_CLIENT_SECRET; stty echo; echo; }
        export GITHUB_CLIENT_ID GITHUB_CLIENT_SECRET
        # Loaded into the Grafana container as environment variables (grafana.envFromSecret)
        yq -n '.apiVersion = "v1" | .kind = "Secret"
          | .metadata.name = "grafana-github" | .metadata.namespace = "monitoring"
          | .stringData.GF_AUTH_GITHUB_CLIENT_ID = strenv(GITHUB_CLIENT_ID)
          | .stringData.GF_AUTH_GITHUB_CLIENT_SECRET = strenv(GITHUB_CLIENT_SECRET)' \
          | kubeseal --format yaml > {{.OUTPUT}}
      - echo "sealed monitoring/grafana-github -> {{.OUTPUT}}"

  seal:slack:
    desc: Seal the Slack bot token Alertmanager posts with (SLACK_BOT_TOKEN, prompted when unset; the Slack App shared with lab-proxmox's vault_slack_bot_token)
    interactive: true
    vars:
      OUTPUT: platform/kube-prometheus-stack/templates/alertmanager-slack.sealedsecret.yaml
    cmds:
      - mkdir -p {{dir .OUTPUT}}
      - |
        [ -n "${SLACK_BOT_TOKEN:-}" ] || { printf 'Slack bot token (xoxb-...): '; stty -echo; read -r SLACK_BOT_TOKEN; stty echo; echo; }
        export SLACK_BOT_TOKEN
        yq -n '.apiVersion = "v1" | .kind = "Secret"
          | .metadata.name = "alertmanager-slack" | .metadata.namespace = "monitoring"
          | .stringData."bot-token" = strenv(SLACK_BOT_TOKEN)' \
          | kubeseal --format yaml > {{.OUTPUT}}
      - echo "sealed monitoring/alertmanager-slack -> {{.OUTPUT}}"

  seal:cloudflared:
    desc: Seal the Cloudflare Tunnel credentials (CLOUDFLARED_CREDENTIALS = file from `cloudflared tunnel create`, prompted when unset) and point the cloudflared config and the Gateway at the tunnel
    interactive: true
    vars:
      OUTPUT: platform/public-gateway/cloudflared-credentials.sealedsecret.yaml
      CONFIG: platform/public-gateway/files/cloudflared.yaml
      GATEWAY: platform/public-gateway/public.gateway.yaml
    cmds:
      - mkdir -p {{dir .OUTPUT}}
      - |
        [ -n "${CLOUDFLARED_CREDENTIALS:-}" ] || { printf 'Tunnel credentials file (~/.cloudflared/<tunnel-id>.json): '; read -r CLOUDFLARED_CREDENTIALS; }
        CLOUDFLARED_CREDENTIALS="${CLOUDFLARED_CREDENTIALS/#\~/$HOME}"
        TUNNEL_ID=$(yq -p json -o yaml '.TunnelID' "$CLOUDFLARED_CREDENTIALS")
        [ -n "$TUNNEL_ID" ] && [ "$TUNNEL_ID" != null ] || { echo "no TunnelID in $CLOUDFLARED_CREDENTIALS" >&2; exit 1; }
        CREDENTIALS_JSON=$(cat "$CLOUDFLARED_CREDENTIALS")
        export CREDENTIALS_JSON
        yq -n '.apiVersion = "v1" | .kind = "Secret"
          | .metadata.name = "cloudflared-credentials" | .metadata.namespace = "public-gateway"
          | .stringData."credentials.json" = strenv(CREDENTIALS_JSON)' \
          | kubeseal --format yaml > {{.OUTPUT}}
        sed -i "s/^tunnel: .*/tunnel: $TUNNEL_ID/" {{.CONFIG}}
        sed -i "s/^\( *external-dns.kubernetes.io\/target:\).*/\1 $TUNNEL_ID.cfargotunnel.com/" {{.GATEWAY}}
        echo "sealed public-gateway/cloudflared-credentials -> {{.OUTPUT}}, tunnel $TUNNEL_ID -> {{.CONFIG}}, {{.GATEWAY}}"

  seal:argocd-github:
    desc: Seal the GitHub OAuth App Argo CD's Dex logs in with (GITHUB_CLIENT_ID / GITHUB_CLIENT_SECRET, prompted when unset; callback https://argocd.<tailnet>.ts.net/api/dex/callback)
    interactive: true
    vars:
      OUTPUT: platform/argocd/templates/argocd-dex-github.sealedsecret.yaml
    cmds:
      - mkdir -p {{dir .OUTPUT}}
      - |
        [ -n "${GITHUB_CLIENT_ID:-}" ] || { printf 'GitHub OAuth client ID: '; read -r GITHUB_CLIENT_ID; }
        [ -n "${GITHUB_CLIENT_SECRET:-}" ] || { printf 'GitHub OAuth client secret: '; stty -echo; read -r GITHUB_CLIENT_SECRET; stty echo; echo; }
        export GITHUB_CLIENT_ID GITHUB_CLIENT_SECRET
        # Argo CD resolves $<secret>:<key> in argocd-cm only from Secrets labelled part-of=argocd
        yq -n '.apiVersion = "v1" | .kind = "Secret"
          | .metadata.name = "argocd-dex-github" | .metadata.namespace = "argocd"
          | .metadata.labels."app.kubernetes.io/part-of" = "argocd"
          | .stringData.clientID = strenv(GITHUB_CLIENT_ID) | .stringData.clientSecret = strenv(GITHUB_CLIENT_SECRET)' \
          | kubeseal --format yaml > {{.OUTPUT}}
      - echo "sealed argocd/argocd-dex-github -> {{.OUTPUT}}"

  seal:external-dns:
    desc: Seal the Cloudflare API token for external-dns (CF_API_TOKEN, prompted when unset; Zone:Zone:Read + Zone:DNS:Edit on mercuryksm.net)
    interactive: true
    vars:
      OUTPUT: platform/external-dns/templates/cloudflare-api-token.sealedsecret.yaml
    cmds:
      - mkdir -p {{dir .OUTPUT}}
      - |
        [ -n "${CF_API_TOKEN:-}" ] || { printf 'Cloudflare API token: '; stty -echo; read -r CF_API_TOKEN; stty echo; echo; }
        export CF_API_TOKEN
        yq -n '.apiVersion = "v1" | .kind = "Secret"
          | .metadata.name = "cloudflare-api-token" | .metadata.namespace = "external-dns"
          | .stringData.api-token = strenv(CF_API_TOKEN)' \
          | kubeseal --format yaml > {{.OUTPUT}}
      - echo "sealed external-dns/cloudflare-api-token -> {{.OUTPUT}}"

  seal:ceph-csi:
    desc: Seal the Ceph key of client.k8s for ceph-csi (CEPH_USER_KEY, prompted when unset; `ceph auth get-key client.k8s` on a Proxmox host)
    interactive: true
    vars:
      OUTPUT: platform/ceph-csi-rbd/templates/csi-rbd-secret.sealedsecret.yaml
    cmds:
      - mkdir -p {{dir .OUTPUT}}
      - |
        [ -n "${CEPH_USER_KEY:-}" ] || { printf 'Ceph key of client.k8s: '; stty -echo; read -r CEPH_USER_KEY; stty echo; echo; }
        export CEPH_USER_KEY
        yq -n '.apiVersion = "v1" | .kind = "Secret"
          | .metadata.name = "csi-rbd-secret" | .metadata.namespace = "ceph-csi-rbd"
          | .stringData.userID = "k8s" | .stringData.userKey = strenv(CEPH_USER_KEY)' \
          | kubeseal --format yaml > {{.OUTPUT}}
      - echo "sealed ceph-csi-rbd/csi-rbd-secret -> {{.OUTPUT}}"

  seal:couchdb:
    desc: Seal the CouchDB admin for Obsidian LiveSync (COUCHDB_USER default admin, COUCHDB_PASSWORD prompted when unset)
    interactive: true
    vars:
      OUTPUT: services/obsidian-livesync/couchdb-admin.sealedsecret.yaml
    cmds:
      - mkdir -p {{dir .OUTPUT}}
      - |
        COUCHDB_USER="${COUCHDB_USER:-admin}"
        [ -n "${COUCHDB_PASSWORD:-}" ] || { printf 'CouchDB admin password: '; stty -echo; read -r COUCHDB_PASSWORD; stty echo; echo; }
        export COUCHDB_USER COUCHDB_PASSWORD
        yq -n '.apiVersion = "v1" | .kind = "Secret"
          | .metadata.name = "couchdb-admin" | .metadata.namespace = "obsidian-livesync"
          | .stringData.username = strenv(COUCHDB_USER) | .stringData.password = strenv(COUCHDB_PASSWORD)' \
          | kubeseal --format yaml > {{.OUTPUT}}
      - echo "sealed obsidian-livesync/couchdb-admin -> {{.OUTPUT}}"

  seal:vaultwarden:
    desc: Seal the Vaultwarden ADMIN_TOKEN (VAULTWARDEN_ADMIN_TOKEN = Argon2id PHC string, prompted when unset; make it with `docker run --rm -it vaultwarden/server /vaultwarden hash --preset owasp`)
    interactive: true
    vars:
      OUTPUT: services/vaultwarden/vaultwarden-admin.sealedsecret.yaml
      STATEFULSET: services/vaultwarden/vaultwarden.statefulset.yaml
    cmds:
      - mkdir -p {{dir .OUTPUT}}
      - |
        [ -n "${VAULTWARDEN_ADMIN_TOKEN:-}" ] || { printf 'ADMIN_TOKEN ($argon2id$...): '; read -r VAULTWARDEN_ADMIN_TOKEN; }
        # Accept the line `vaultwarden hash` prints, ADMIN_TOKEN='...', as well as the bare string
        VAULTWARDEN_ADMIN_TOKEN="${VAULTWARDEN_ADMIN_TOKEN#ADMIN_TOKEN=}"
        VAULTWARDEN_ADMIN_TOKEN="${VAULTWARDEN_ADMIN_TOKEN#\'}"
        VAULTWARDEN_ADMIN_TOKEN="${VAULTWARDEN_ADMIN_TOKEN%\'}"
        case "$VAULTWARDEN_ADMIN_TOKEN" in
          '$argon2id$'*) ;;
          *) echo "not an Argon2id PHC string" >&2; exit 1 ;;
        esac
        export VAULTWARDEN_ADMIN_TOKEN
        yq -n '.apiVersion = "v1" | .kind = "Secret"
          | .metadata.name = "vaultwarden-admin" | .metadata.namespace = "vaultwarden"
          | .stringData.token = strenv(VAULTWARDEN_ADMIN_TOKEN)' \
          | kubeseal --format yaml > {{.OUTPUT}}
        # The token is read at startup only: a new checksum rolls the Pod once Argo CD syncs the commit
        CHECKSUM=$(sha256sum {{.OUTPUT}} | cut -c1-16)
        sed -i "s/^\( *checksum\/admin-token:\).*/\1 $CHECKSUM/" {{.STATEFULSET}}
      - echo "sealed vaultwarden/vaultwarden-admin -> {{.OUTPUT}}, checksum -> {{.STATEFULSET}}"

  seal:tolo:
    desc: Seal the TOLO Secret tolo with every value the cluster generates (signing keys, client secrets, database passwords and the seed user owner, whose id and tenant come from the tolo-manifest ref in services/tolo/kustomization.yaml), usable in any namespace. KEYS=<key>,... seals only those keys into the existing file and keeps the others. The environment variable OWNER_PASSWORD sets the password of owner (8 characters to 72 bytes), random when unset
    vars:
      OUTPUT: '{{.OUTPUT | default "services/tolo/cluster/tolo.sealedsecret.yaml"}}'
    cmds:
      - mkdir -p {{dir .OUTPUT}}
      - |
        KEYS="$(printf '%s' '{{.KEYS}}' | tr ',' ' ')"
        for key in $KEYS; do
          case " {{.TOLO_SECRET_KEYS}} " in *" $key "*) ;; *) echo "unknown key: $key (one of {{.TOLO_SECRET_KEYS}})" >&2; exit 1 ;; esac
        done
        test -z "$KEYS" || test -f {{.OUTPUT}} || { echo "{{.OUTPUT}} not found: seal every key first (no KEYS)" >&2; exit 1; }
        SECRET="$(yq -n '.apiVersion = "v1" | .kind = "Secret"
          | .metadata.name = "tolo"
          | .metadata.annotations."sealedsecrets.bitnami.com/cluster-wide" = "true"')"
        for key in ${KEYS:-{{.TOLO_SECRET_KEYS}}}; do
          case "$key" in
            signing-key.pem) VALUE="$(openssl ecparam -name prime256v1 -genkey -noout)" ;;
            jwk-private-key.pem) VALUE="$(openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048)" ;;
            seed-users.json)
              REF="$(yq '.resources[0]' services/tolo/kustomization.yaml | sed 's/.*?ref=//')"
              RAW="https://raw.githubusercontent.com/pj-hoakari/tolo-manifest/$REF"
              TENANT="$(curl -fsSL "$RAW/base/kustomization.yaml" | yq '.configMapGenerator[] | select(.name == "tolo-fixture") | .literals[] | select(test("^tenant-id=")) | sub("^tenant-id="; "")')"
              ID="$(curl -fsSL "$RAW/components/idp/kustomization.yaml" | yq '.configMapGenerator[] | select(.name == "tolo-fixture") | .literals[] | select(test("^owner-sub=")) | sub("^owner-sub="; "")')"
              test -n "$TENANT" && test -n "$ID" || { echo "tenant-id or owner-sub not found at tolo-manifest $REF" >&2; exit 1; }
              PASSWORD="${OWNER_PASSWORD:-$(openssl rand -hex 16)}"
              test "${#PASSWORD}" -ge 8 && test "$(printf '%s' "$PASSWORD" | wc -c)" -le 72 || { echo "OWNER_PASSWORD must be 8 characters to 72 bytes" >&2; exit 1; }
              VALUE="$(ID="$ID" TENANT="$TENANT" PASSWORD="$PASSWORD" yq -n -o json '.users = [{"id": strenv(ID), "tenantId": strenv(TENANT), "username": "owner", "password": strenv(PASSWORD)}]')"
              ;;
            *) VALUE="$(openssl rand -hex 32)" ;;
          esac
          SECRET="$(printf '%s\n' "$SECRET" | VALUE="$VALUE" KEY="$key" yq '.stringData[strenv(KEY)] = strenv(VALUE)')"
        done
        if [ -n "$KEYS" ]; then
          printf '%s\n' "$SECRET" | kubeseal --format yaml --scope cluster-wide --merge-into {{.OUTPUT}}
        else
          printf '%s\n' "$SECRET" | kubeseal --format yaml --scope cluster-wide > {{.OUTPUT}}
        fi
      - echo "sealed tolo (cluster-wide) -> {{.OUTPUT}}"

  check:tolo-secrets:
    desc: Check that the keys of the Secret tolo the TOLO services read, the keys seal:tolo generates and the keys sealed in services/tolo/cluster/tolo.sealedsecret.yaml are the same
    deps: [repos]
    cmds:
      - |
        USED="$(task render APP=tolo | yq -N '[.. | select(has("secretKeyRef")) | .secretKeyRef | select(.name == "tolo") | .key] + [.. | select(has("secret")) | .secret | select(.secretName == "tolo") | .items[].key] | .[]' | sort -u)"
        GENERATED="$(printf '%s\n' {{.TOLO_SECRET_KEYS}} | sort -u)"
        SEALED="$(yq '.spec.encryptedData | keys | .[]' services/tolo/cluster/tolo.sealedsecret.yaml | sort -u)"
        test "$USED" = "$GENERATED" || { echo "keys read by the services and TOLO_SECRET_KEYS differ:" >&2; diff <(printf '%s\n' "$USED") <(printf '%s\n' "$GENERATED") >&2; exit 1; }
        test "$USED" = "$SEALED" || { echo "keys read by the services and the sealed keys differ:" >&2; diff <(printf '%s\n' "$USED") <(printf '%s\n' "$SEALED") >&2; exit 1; }

  seal:tolo-firebase:
    desc: Seal the TOLO Secret tolo-firebase from the Firebase test project (FIREBASE_PROJECT_ID, FIREBASE_API_KEY, FIREBASE_AUTH_DOMAIN, FIREBASE_APP_ID of its web app, FIREBASE_SERVICE_ACCOUNT_FILE = key file of the edge-bridge service account; prompted when unset), usable in any namespace
    interactive: true
    vars:
      OUTPUT: services/tolo/cluster/tolo-firebase.sealedsecret.yaml
    cmds:
      - mkdir -p {{dir .OUTPUT}}
      - |
        for v in FIREBASE_PROJECT_ID FIREBASE_API_KEY FIREBASE_AUTH_DOMAIN FIREBASE_APP_ID FIREBASE_SERVICE_ACCOUNT_FILE; do
          eval "[ -n \"\${$v:-}\" ]" || { printf '%s: ' "$v"; read -r "$v"; }
          export "$v"
        done
        test -f "$FIREBASE_SERVICE_ACCOUNT_FILE" || { echo "not found: $FIREBASE_SERVICE_ACCOUNT_FILE" >&2; exit 1; }
        FIREBASE_SERVICE_ACCOUNT="$(cat "$FIREBASE_SERVICE_ACCOUNT_FILE")"
        export FIREBASE_SERVICE_ACCOUNT
        yq -n '.apiVersion = "v1" | .kind = "Secret"
          | .metadata.name = "tolo-firebase"
          | .metadata.annotations."sealedsecrets.bitnami.com/cluster-wide" = "true"
          | .stringData."project-id" = strenv(FIREBASE_PROJECT_ID)
          | .stringData."api-key" = strenv(FIREBASE_API_KEY)
          | .stringData."auth-domain" = strenv(FIREBASE_AUTH_DOMAIN)
          | .stringData."app-id" = strenv(FIREBASE_APP_ID)
          | .stringData."service-account.json" = strenv(FIREBASE_SERVICE_ACCOUNT)' \
          | kubeseal --format yaml --scope cluster-wide > {{.OUTPUT}}
      - echo "sealed tolo-firebase (cluster-wide) -> {{.OUTPUT}}"

  backup:sealed-secrets:
    desc: Export the sealed-secrets controller keys, sops-encrypted to the age keys in lab-proxmox/.sops.yaml (OUTPUT=..., default ~/sealed-secrets-keys-<date>.sops.yaml). Keep the file offline and in Vaultwarden, and redo it after the controller adds a key (every 30 days)
    vars:
      OUTPUT: '{{.OUTPUT | default ""}}'
    cmds:
      - |
        OUT="{{.OUTPUT}}"
        OUT="${OUT:-$HOME/sealed-secrets-keys-$(date +%F).sops.yaml}"
        install -m 0600 /dev/null "$OUT"
        kubectl -n kube-system get secret -l sealedsecrets.bitnami.com/sealed-secrets-key -o yaml \
          | yq 'del(.items[].metadata.uid, .items[].metadata.resourceVersion, .items[].metadata.creationTimestamp, .items[].metadata.managedFields)' \
          | sops --config ../lab-proxmox/.sops.yaml encrypt --encrypted-regex '^(data|stringData)$' \
              --filename-override "$OUT" --input-type yaml --output-type yaml /dev/stdin > "$OUT"
        echo "$(yq '.items | length' "$OUT") key(s) -> $OUT"

  restore:sealed-secrets:
    desc: Load the keys from a backup:sealed-secrets file into the cluster (FILE=...), so existing SealedSecrets decrypt without resealing
    requires:
      vars: [FILE]
    cmds:
      - sops decrypt --input-type yaml --output-type yaml {{.FILE}} | kubectl apply -f -
      - kubectl -n kube-system rollout restart deploy/sealed-secrets-controller
