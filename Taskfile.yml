# https://taskfile.dev

version: '3'

vars:
  COMPONENTS:
    sh: ls platform
  # kubeconfig written by the lab-proxmox playbook (override with KUBECONFIG=...)
  KUBECONFIG: '{{.KUBECONFIG | default "../lab-proxmox/ansible/artifacts/k8s.kubeconfig"}}'

env:
  KUBECONFIG: '{{.KUBECONFIG}}'

tasks:
  default:
    cmds:
      - task --list
    silent: true

  repos:
    desc: Register the Helm repositories referenced by the component charts (needed by helm dependency build)
    run: once
    cmds:
      - |
        for chart in platform/*/Chart.yaml; do
          yq '.dependencies[] | .name + " " + .repository' "$chart"
        done | sort -u | while read -r name url; do
          helm repo add "$name" "$url" --force-update >/dev/null
        done

  deps:
    desc: Download the pinned chart dependencies of every component (from Chart.lock)
    deps: [repos]
    cmds:
      - for: { var: COMPONENTS }
        cmd: helm dependency build platform/{{.ITEM}}

  deps:update:
    desc: Re-resolve dependencies and rewrite Chart.lock after changing a version in Chart.yaml (APP=<component>)
    requires:
      vars: [APP]
    cmds:
      - helm dependency update platform/{{.APP}}

  render:
    desc: Render a component exactly as Argo CD does (APP=<component>)
    deps: [repos]
    requires:
      vars: [APP]
    vars:
      RELEASE:
        sh: yq '.components["{{.APP}}"].releaseName' apps/values.yaml
      NAMESPACE:
        sh: yq '.components["{{.APP}}"].namespace' apps/values.yaml
    cmds:
      - helm dependency build platform/{{.APP}} >/dev/null
      - helm template {{.RELEASE}} platform/{{.APP}} --namespace {{.NAMESPACE}} --include-crds

  render:cilium:
    desc: Render Cilium with the pin and values of the shared cilium/ directory
    vars:
      REPO:
        sh: yq .repo cilium/version.yaml
      CHART:
        sh: yq .chart cilium/version.yaml
      VERSION:
        sh: yq .version cilium/version.yaml
    cmds:
      - helm template cilium {{.CHART}} --repo {{.REPO}} --version {{.VERSION}} --namespace kube-system --values cilium/values.yaml

  render:apps:
    desc: Render the Argo CD Applications generated by the root app
    cmds:
      - helm template apps apps

  lint:
    desc: Lint and render every chart to catch errors before pushing
    deps: [repos]
    cmds:
      - helm lint apps --quiet
      - helm template apps apps >/dev/null
      - for: { var: COMPONENTS }
        task: lint:component
        vars:
          APP: '{{.ITEM}}'
      - task render:cilium >/dev/null

  lint:component:
    internal: true
    cmds:
      - helm dependency build platform/{{.APP}} >/dev/null
      - helm lint platform/{{.APP}} --quiet
      - task render APP={{.APP}} >/dev/null

  bootstrap:
    desc: Apply the root Application (app-of-apps) to the cluster in KUBECONFIG
    preconditions:
      - sh: test -f "$KUBECONFIG"
        msg: "kubeconfig not found: {{.KUBECONFIG}} (build the cluster with lab-proxmox first, or set KUBECONFIG=...)"
    cmds:
      - echo "applying bootstrap/root.yaml to $(kubectl config view --minify -o jsonpath='{.clusters[0].cluster.server}')"
      - kubectl apply -f bootstrap/root.yaml

  # Secrets are built in memory from environment variables (strenv) and sealed with the cluster's public
  # key, so plaintext never touches the disk or the command line. kubeseal talks to
  # kube-system/sealed-secrets-controller, the name set in platform/sealed-secrets.

  seal:tailscale:
    desc: Seal the Tailscale operator OAuth client (TS_CLIENT_ID / TS_CLIENT_SECRET, prompted when unset)
    interactive: true
    vars:
      OUTPUT: platform/tailscale/templates/operator-oauth.sealedsecret.yaml
    cmds:
      - mkdir -p {{dir .OUTPUT}}
      - |
        [ -n "${TS_CLIENT_ID:-}" ] || { printf 'Tailscale OAuth client ID: '; read -r TS_CLIENT_ID; }
        [ -n "${TS_CLIENT_SECRET:-}" ] || { printf 'Tailscale OAuth client secret: '; stty -echo; read -r TS_CLIENT_SECRET; stty echo; echo; }
        export TS_CLIENT_ID TS_CLIENT_SECRET
        yq -n '.apiVersion = "v1" | .kind = "Secret"
          | .metadata.name = "operator-oauth" | .metadata.namespace = "tailscale"
          | .stringData.client_id = strenv(TS_CLIENT_ID) | .stringData.client_secret = strenv(TS_CLIENT_SECRET)' \
          | kubeseal --format yaml > {{.OUTPUT}}
      - echo "sealed tailscale/operator-oauth -> {{.OUTPUT}}"

  seal:grafana:
    desc: Seal the Grafana admin credentials (GRAFANA_ADMIN_USER default admin, GRAFANA_ADMIN_PASSWORD prompted when unset)
    interactive: true
    vars:
      OUTPUT: platform/kube-prometheus-stack/templates/grafana-admin.sealedsecret.yaml
    cmds:
      - mkdir -p {{dir .OUTPUT}}
      - |
        GRAFANA_ADMIN_USER="${GRAFANA_ADMIN_USER:-admin}"
        [ -n "${GRAFANA_ADMIN_PASSWORD:-}" ] || { printf 'Grafana admin password: '; stty -echo; read -r GRAFANA_ADMIN_PASSWORD; stty echo; echo; }
        export GRAFANA_ADMIN_USER GRAFANA_ADMIN_PASSWORD
        yq -n '.apiVersion = "v1" | .kind = "Secret"
          | .metadata.name = "grafana-admin" | .metadata.namespace = "monitoring"
          | .stringData.admin-user = strenv(GRAFANA_ADMIN_USER) | .stringData.admin-password = strenv(GRAFANA_ADMIN_PASSWORD)' \
          | kubeseal --format yaml > {{.OUTPUT}}
      - echo "sealed monitoring/grafana-admin -> {{.OUTPUT}}"

  seal:cloudflared:
    desc: Seal the Cloudflare Tunnel credentials (CLOUDFLARED_CREDENTIALS = file from `cloudflared tunnel create`, prompted when unset) and set tunnelID
    interactive: true
    vars:
      OUTPUT: platform/public-gateway/templates/cloudflared-credentials.sealedsecret.yaml
      VALUES: platform/public-gateway/values.yaml
    cmds:
      - mkdir -p {{dir .OUTPUT}}
      - |
        [ -n "${CLOUDFLARED_CREDENTIALS:-}" ] || { printf 'Tunnel credentials file (~/.cloudflared/<tunnel-id>.json): '; read -r CLOUDFLARED_CREDENTIALS; }
        CLOUDFLARED_CREDENTIALS="${CLOUDFLARED_CREDENTIALS/#\~/$HOME}"
        TUNNEL_ID=$(yq -p json -o yaml '.TunnelID' "$CLOUDFLARED_CREDENTIALS")
        [ -n "$TUNNEL_ID" ] && [ "$TUNNEL_ID" != null ] || { echo "no TunnelID in $CLOUDFLARED_CREDENTIALS" >&2; exit 1; }
        CREDENTIALS_JSON=$(cat "$CLOUDFLARED_CREDENTIALS")
        export CREDENTIALS_JSON
        yq -n '.apiVersion = "v1" | .kind = "Secret"
          | .metadata.name = "cloudflared-credentials" | .metadata.namespace = "public-gateway"
          | .stringData."credentials.json" = strenv(CREDENTIALS_JSON)' \
          | kubeseal --format yaml > {{.OUTPUT}}
        sed -i "s/^tunnelID: .*/tunnelID: \"$TUNNEL_ID\"/" {{.VALUES}}
        echo "sealed public-gateway/cloudflared-credentials -> {{.OUTPUT}}, tunnelID $TUNNEL_ID -> {{.VALUES}}"

  seal:external-dns:
    desc: Seal the Cloudflare API token for external-dns (CF_API_TOKEN, prompted when unset; Zone:Zone:Read + Zone:DNS:Edit on mercuryksm.net)
    interactive: true
    vars:
      OUTPUT: platform/external-dns/templates/cloudflare-api-token.sealedsecret.yaml
    cmds:
      - mkdir -p {{dir .OUTPUT}}
      - |
        [ -n "${CF_API_TOKEN:-}" ] || { printf 'Cloudflare API token: '; stty -echo; read -r CF_API_TOKEN; stty echo; echo; }
        export CF_API_TOKEN
        yq -n '.apiVersion = "v1" | .kind = "Secret"
          | .metadata.name = "cloudflare-api-token" | .metadata.namespace = "external-dns"
          | .stringData.api-token = strenv(CF_API_TOKEN)' \
          | kubeseal --format yaml > {{.OUTPUT}}
      - echo "sealed external-dns/cloudflare-api-token -> {{.OUTPUT}}"

  seal:ceph-csi:
    desc: Seal the Ceph key of client.k8s for ceph-csi (CEPH_USER_KEY, prompted when unset; `ceph auth get-key client.k8s` on a Proxmox host)
    interactive: true
    vars:
      OUTPUT: platform/ceph-csi-rbd/templates/csi-rbd-secret.sealedsecret.yaml
    cmds:
      - mkdir -p {{dir .OUTPUT}}
      - |
        [ -n "${CEPH_USER_KEY:-}" ] || { printf 'Ceph key of client.k8s: '; stty -echo; read -r CEPH_USER_KEY; stty echo; echo; }
        export CEPH_USER_KEY
        yq -n '.apiVersion = "v1" | .kind = "Secret"
          | .metadata.name = "csi-rbd-secret" | .metadata.namespace = "ceph-csi-rbd"
          | .stringData.userID = "k8s" | .stringData.userKey = strenv(CEPH_USER_KEY)' \
          | kubeseal --format yaml > {{.OUTPUT}}
      - echo "sealed ceph-csi-rbd/csi-rbd-secret -> {{.OUTPUT}}"

  seal:couchdb:
    desc: Seal the CouchDB admin for Obsidian LiveSync (COUCHDB_USER default admin, COUCHDB_PASSWORD prompted when unset)
    interactive: true
    vars:
      OUTPUT: platform/obsidian-livesync/templates/couchdb-admin.sealedsecret.yaml
    cmds:
      - mkdir -p {{dir .OUTPUT}}
      - |
        COUCHDB_USER="${COUCHDB_USER:-admin}"
        [ -n "${COUCHDB_PASSWORD:-}" ] || { printf 'CouchDB admin password: '; stty -echo; read -r COUCHDB_PASSWORD; stty echo; echo; }
        export COUCHDB_USER COUCHDB_PASSWORD
        yq -n '.apiVersion = "v1" | .kind = "Secret"
          | .metadata.name = "couchdb-admin" | .metadata.namespace = "obsidian-livesync"
          | .stringData.username = strenv(COUCHDB_USER) | .stringData.password = strenv(COUCHDB_PASSWORD)' \
          | kubeseal --format yaml > {{.OUTPUT}}
      - echo "sealed obsidian-livesync/couchdb-admin -> {{.OUTPUT}}"
