[tools]
helm = "4.3.0"
kubectl = "latest"
kubeseal = "latest"
# Same version as the one Argo CD's repo-server builds kustomizations with: `task check:kustomize` derives it from the
# argo-cd chart in platform/argocd, and the kustomize-version workflow fixes it on the PRs that change that chart
kustomize = "5.8.1"
sops = "3.13.3"
task = "3.54.0"
yq = "latest"

[env]
# Helm repositories of this project only, apart from the user's global ones (same as Taskfile.yml)
HELM_REPOSITORY_CONFIG = "{{config_root}}/.helm/repositories.yaml"
HELM_REPOSITORY_CACHE = "{{config_root}}/.helm/repository"
