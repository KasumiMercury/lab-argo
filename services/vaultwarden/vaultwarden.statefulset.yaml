# Single-replica Vaultwarden on SQLite. ADMIN_TOKEN (Argon2id PHC string) comes from
# vaultwarden-admin.sealedsecret.yaml (task seal:vaultwarden); without it the /admin page stays disabled.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vaultwarden
spec:
  serviceName: vaultwarden
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vaultwarden
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vaultwarden
      annotations:
        # ADMIN_TOKEN is read at startup only: roll the Pod when the sealed token changes
        # (task seal:vaultwarden sets the first 16 hex digits of the sha256 of vaultwarden-admin.sealedsecret.yaml)
        checksum/admin-token: 1cb7265ae6c6d393
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: vaultwarden
          image: vaultwarden/server
          env:
            - name: DOMAIN
              value: https://vault.tail4a681d.ts.net
            # Port 80 needs root
            - name: ROCKET_PORT
              value: "8080"
            # Accounts are created by invitation from /admin. Without SMTP the invited address registers directly
            - name: SIGNUPS_ALLOWED
              value: "false"
            - name: SHOW_PASSWORD_HINT
              value: "false"
            # The Tailscale proxy is the peer; the client address is in X-Forwarded-For
            - name: IP_HEADER
              value: X-Forwarded-For
            - name: ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: vaultwarden-admin
                  key: token
                  optional: true
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /alive
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /alive
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        storageClassName: ceph-rbd
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
