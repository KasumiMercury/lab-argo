# Daily backup to the NAS: a consistent SQLite copy (`vaultwarden backup`, VACUUM INTO) plus the files that are
# not in the database, as vaultwarden-<UTC time>.tar.gz. A failed run raises KubeJobFailed (Slack #k8s-alert).
#
# Restore: scale the StatefulSet to 0, mount the data volume, extract the archive into it (db.sqlite3 replaces
# the live one; delete db.sqlite3-wal and db.sqlite3-shm first), chown -R 1000:1000, scale back to 1.
#
# The PV is static with reclaimPolicy Retain, so deleting the PVC or the Application never deletes backups.
# It covers the whole nfs-csi export; the Job mounts only the subPath (kubelet creates it on first use).
apiVersion: v1
kind: PersistentVolume
metadata:
  name: vaultwarden-backup
spec:
  capacity:
    storage: {{ .Values.backup.nfs.size }}
  accessModes: ["ReadWriteMany"]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef:
    namespace: {{ .Release.Namespace }}
    name: vaultwarden-backup
  csi:
    driver: nfs.csi.k8s.io
    volumeHandle: {{ .Values.backup.nfs.server }}#{{ trimPrefix "/" .Values.backup.nfs.share }}#vaultwarden-backup
    volumeAttributes:
      server: {{ .Values.backup.nfs.server }}
      share: {{ .Values.backup.nfs.share }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vaultwarden-backup
spec:
  storageClassName: ""
  volumeName: vaultwarden-backup
  accessModes: ["ReadWriteMany"]
  resources:
    requests:
      storage: {{ .Values.backup.nfs.size }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: vaultwarden-backup
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  timeZone: Asia/Tokyo
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/name: vaultwarden-backup
        spec:
          restartPolicy: Never
          # The data volume is ReadWriteOnce (one node): run next to the Vaultwarden Pod
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: vaultwarden
                  topologyKey: kubernetes.io/hostname
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: backup
              image: "{{ .Values.vaultwarden.image.repository }}:{{ .Values.vaultwarden.image.tag }}"
              # The image's default DATA_FOLDER is "data", relative to the working directory
              env:
                - name: DATA_FOLDER
                  value: /data
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  umask 077
                  cd /data
                  out=$(/vaultwarden backup)
                  echo "$out"
                  snapshot=$(echo "$out" | sed -n "s|^Backup to '/data/\(db_[0-9_]*\.sqlite3\)' was successful$|\1|p")
                  [ -n "$snapshot" ] || { echo "no snapshot file in the output" >&2; exit 1; }
                  name="vaultwarden-$(date -u +%Y%m%dT%H%M%SZ).tar.gz"
                  trap 'rm -f "/data/$snapshot" "/backup/$name.tmp"' EXIT
                  set -- "$snapshot"
                  for f in attachments sends rsa_key.pem rsa_key.pub.pem config.json; do
                    [ -e "$f" ] && set -- "$@" "$f"
                  done
                  tar -czf "/backup/$name.tmp" --transform "s|^$snapshot\$|db.sqlite3|" "$@"
                  tar -tzf "/backup/$name.tmp" >/dev/null
                  mv "/backup/$name.tmp" "/backup/$name"
                  find /backup -maxdepth 1 -name 'vaultwarden-*.tar.gz' -mtime +{{ .Values.backup.retentionDays }} -print -delete
                  ls -l /backup
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 128Mi
              # Root (no_root_squash on the NAS) to create files in the kubelet-made subPath;
              # DAC_OVERRIDE to read the 0600 files of uid 1000 and write in /data
              securityContext:
                runAsUser: 0
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
                  add: ["DAC_OVERRIDE"]
              volumeMounts:
                - name: data
                  mountPath: /data
                - name: backup
                  mountPath: /backup
                  subPath: {{ .Values.backup.nfs.subPath }}
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: data-vaultwarden-0
            - name: backup
              persistentVolumeClaim:
                claimName: vaultwarden-backup
