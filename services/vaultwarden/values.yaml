# Tailscale device name: the Ingress is reachable at https://<hostname>.<tailnet>.ts.net and from the tailnet
# only (no Funnel). The tailnet policy decides who reaches it, through the tag below.
hostname: vault
tailnet: tail4a681d.ts.net
# tagOwners must let tag:k8s-operator own this tag, or the proxy never joins the tailnet
tailscaleTag: tag:vaultwarden

vaultwarden:
  image:
    repository: vaultwarden/server
    tag: 1.37.4
  # RBD volume (StorageClass ceph-rbd, reclaimPolicy Retain) holding /data: SQLite, attachments, sends, RSA key
  storage: 2Gi

backup:
  schedule: "30 3 * * *"
  # Archives older than this are deleted on every run
  retentionDays: 30
  # Static PV on the NAS export used by nfs-csi; the Job only sees the subPath below
  nfs:
    server: 192.168.110.5
    share: /nfs/k8s
    subPath: vaultwarden-backup
    size: 5Gi
