apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: tolo-idp-db
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: tolo-idp-db
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: tolo-idp
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
