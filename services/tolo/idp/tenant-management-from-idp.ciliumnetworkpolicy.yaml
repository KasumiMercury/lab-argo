apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: tenant-management-from-idp
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: tenant-management
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: tolo-idp
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
