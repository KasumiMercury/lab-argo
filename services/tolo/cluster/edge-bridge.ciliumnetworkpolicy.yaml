apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: edge-bridge
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: edge-bridge
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: web
      toPorts:
        - ports:
            - port: "8787"
              protocol: TCP
  egress:
    - toFQDNs:
        - matchPattern: "*.googleapis.com"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
