apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  template:
    spec:
      initContainers:
        - name: models
          image: busybox
          command:
            - cp
            - /source/yolo26n.onnx
            - /models/
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: models
              mountPath: /models
            - name: models-source
              mountPath: /source
              subPath: tolo-models
              readOnly: true
      containers:
        - name: web
          env:
            - name: ROOT_DOMAIN
              value: tolo.mercuryksm.net
            - name: AUTH_MOCKING_ALLOWED_ROOT_DOMAINS
              value: tolo.mercuryksm.net
            - name: FIREBASE_PROJECT_ID
              valueFrom:
                secretKeyRef:
                  name: tolo-firebase
                  key: project-id
            - name: FIREBASE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: tolo-firebase
                  key: api-key
            - name: FIREBASE_AUTH_DOMAIN
              valueFrom:
                secretKeyRef:
                  name: tolo-firebase
                  key: auth-domain
            - name: FIREBASE_APP_ID
              valueFrom:
                secretKeyRef:
                  name: tolo-firebase
                  key: app-id
      volumes:
        - name: models-source
          persistentVolumeClaim:
            claimName: tolo-models
            readOnly: true
