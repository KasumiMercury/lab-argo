apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: service-gateway
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: service-gateway
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: web
        - matchLabels:
            app.kubernetes.io/name: tenant-management
        - matchLabels:
            app.kubernetes.io/name: graph-authoring
        - matchLabels:
            app.kubernetes.io/name: observation
        - matchLabels:
            app.kubernetes.io/name: operation
        - matchLabels:
            app.kubernetes.io/name: guest
        - matchLabels:
            app.kubernetes.io/name: realtime
        - matchLabels:
            app.kubernetes.io/name: seed
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: tenant-management
        - matchLabels:
            app.kubernetes.io/name: graph-authoring
        - matchLabels:
            app.kubernetes.io/name: observation
        - matchLabels:
            app.kubernetes.io/name: operation
        - matchLabels:
            app.kubernetes.io/name: guest
      toPorts:
        - ports:
            - port: "8090"
              protocol: TCP
