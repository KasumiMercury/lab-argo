apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: operation
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: operation
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: service-gateway
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
