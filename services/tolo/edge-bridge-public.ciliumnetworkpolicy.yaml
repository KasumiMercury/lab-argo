apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: edge-bridge-public
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: edge-bridge
  ingress:
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "8787"
              protocol: TCP
