apiVersion: apps/v1
kind: Deployment
metadata:
  name: nats-bridge
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: nats-bridge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nats-bridge
    spec:
      enableServiceLinks: false
      containers:
        - name: nats-bridge
          image: ghcr.io/kasumimercury/primind-nats-bridge
          env:
            - name: ENV
              value: production
            - name: SERVICE_NAME
              value: nats-bridge
            - name: CONFIG_PATH
              value: /app/config.json
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: jaeger:4318
            - name: OTEL_EXPORTER_OTLP_METRICS_ENDPOINT
              value: alloy.logging.svc:9090
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            grpc:
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            grpc:
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            initialDelaySeconds: 60
          volumeMounts:
            - name: config
              mountPath: /app/config.json
              subPath: config.json
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: nats-bridge
