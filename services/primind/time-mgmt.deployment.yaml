apiVersion: apps/v1
kind: Deployment
metadata:
  name: time-mgmt
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: time-mgmt
  template:
    metadata:
      labels:
        app.kubernetes.io/name: time-mgmt
    spec:
      enableServiceLinks: false
      initContainers:
        - name: migrate
          image: arigaio/atlas
          args:
            - migrate
            - apply
            - --dir
            - file:///migrations
            - --url
            - postgres://timemgmt_user:$(POSTGRES_TIME_MGMT_PASSWORD)@postgres-time-mgmt:5432/timemgmt_db?sslmode=disable
          env:
            - name: POSTGRES_TIME_MGMT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: primind
                  key: POSTGRES_TIME_MGMT_PASSWORD
          volumeMounts:
            - name: migrations
              mountPath: /migrations
              readOnly: true
      containers:
        - name: time-mgmt
          image: ghcr.io/kasumimercury/primind-remind-time-mgmt
          envFrom:
            - secretRef:
                name: primind
          env:
            - name: ENV
              value: production
            - name: SERVICE_NAME
              value: time-mgmt
            - name: POSTGRES_TIME_MGMT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: primind
                  key: POSTGRES_TIME_MGMT_PASSWORD
            - name: POSTGRES_DSN
              value: postgres://timemgmt_user:$(POSTGRES_TIME_MGMT_PASSWORD)@postgres-time-mgmt:5432/timemgmt_db?sslmode=disable
            - name: NATS_URL
              value: nats://nats:4222
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: alloy.logging.svc:4318
            - name: OTEL_EXPORTER_OTLP_METRICS_ENDPOINT
              value: alloy.logging.svc:9090
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            grpc:
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            grpc:
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            initialDelaySeconds: 60
      volumes:
        - name: migrations
          configMap:
            name: time-mgmt-migrations
