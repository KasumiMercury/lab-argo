apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-time-mgmt
spec:
  serviceName: postgres-time-mgmt
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres-time-mgmt
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres-time-mgmt
    spec:
      enableServiceLinks: false
      containers:
        - name: postgres
          image: postgres
          env:
            - name: POSTGRES_USER
              value: timemgmt_user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: primind
                  key: POSTGRES_TIME_MGMT_PASSWORD
            - name: POSTGRES_DB
              value: timemgmt_db
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - timemgmt_user
                - -d
                - timemgmt_db
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        storageClassName: ceph-rbd
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
