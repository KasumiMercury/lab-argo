apiVersion: apps/v1
kind: Deployment
metadata:
  name: scheduler
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: scheduler
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scheduler
    spec:
      enableServiceLinks: false
      containers:
        - name: scheduler
          image: curlimages/curl
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 64Mi
          command:
            - /bin/sh
            - -c
          args:
            - |
              echo "Scheduler started - polling every 60 seconds"
              while true; do
                echo "[$$(date)] Triggering throttle..."
                curl -s -X POST http://throttling:8080/api/v1/throttle || echo "Failed"
                sleep 60
              done
