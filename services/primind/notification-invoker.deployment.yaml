apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-invoker
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: notification-invoker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: notification-invoker
    spec:
      enableServiceLinks: false
      containers:
        - name: notification-invoker
          image: ghcr.io/kasumimercury/primind-notification-invoker
          envFrom:
            - secretRef:
                name: primind
          env:
            - name: ENV
              value: production
            - name: SERVICE_NAME
              value: notification-invoker
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: /secrets/gcp-credentials.json
            - name: PORT
              value: "8080"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: jaeger:4318
            - name: OTEL_EXPORTER_OTLP_METRICS_ENDPOINT
              value: prometheus:9090
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            grpc:
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            grpc:
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            initialDelaySeconds: 60
          volumeMounts:
            - name: gcp-credentials
              mountPath: /secrets
              readOnly: true
      volumes:
        - name: gcp-credentials
          secret:
            secretName: primind-gcp-credentials
