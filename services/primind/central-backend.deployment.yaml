apiVersion: apps/v1
kind: Deployment
metadata:
  name: central-backend
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: central-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: central-backend
    spec:
      enableServiceLinks: false
      initContainers:
        - name: migrate
          image: arigaio/atlas
          args:
            - migrate
            - apply
            - --dir
            - file:///migrations
            - --url
            - postgres://primind_user:$(POSTGRES_CENTRAL_PASSWORD)@postgres-central:5432/primind_db?sslmode=disable
          env:
            - name: POSTGRES_CENTRAL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: primind
                  key: POSTGRES_CENTRAL_PASSWORD
          volumeMounts:
            - name: migrations
              mountPath: /migrations
              readOnly: true
      containers:
        - name: central-backend
          image: ghcr.io/kasumimercury/primind-central-backend
          envFrom:
            - secretRef:
                name: primind
          env:
            - name: ENV
              value: production
            - name: SERVICE_NAME
              value: central-backend
            - name: POSTGRES_CENTRAL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: primind
                  key: POSTGRES_CENTRAL_PASSWORD
            - name: POSTGRES_DSN
              value: postgres://primind_user:$(POSTGRES_CENTRAL_PASSWORD)@postgres-central:5432/primind_db?sslmode=disable
            - name: REDIS_ADDR
              value: redis:6379
            - name: PRIMIND_TASKS_URL
              value: http://tasks-api:8080
            - name: REMIND_REGISTER_QUEUE_NAME
              value: remind-register
            - name: REMIND_CANCEL_QUEUE_NAME
              value: remind-cancel
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: alloy.logging.svc:4318
            - name: OTEL_EXPORTER_OTLP_METRICS_ENDPOINT
              value: alloy.logging.svc:9090
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            grpc:
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            grpc:
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            initialDelaySeconds: 60
      volumes:
        - name: migrations
          configMap:
            name: central-backend-migrations
