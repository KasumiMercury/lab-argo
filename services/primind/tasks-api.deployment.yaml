apiVersion: apps/v1
kind: Deployment
metadata:
  name: tasks-api
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: tasks-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tasks-api
    spec:
      enableServiceLinks: false
      containers:
        - name: tasks-api
          image: primind-tasks-api
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          env:
            - name: ENV
              value: production
            - name: SERVICE_NAME
              value: taskqueue-api
            - name: REDIS_ADDR
              value: redis:6379
            - name: API_PORT
              value: "8080"
            - name: RETRY_COUNT
              value: "3"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: alloy.logging.svc:4318
            - name: OTEL_EXPORTER_OTLP_METRICS_ENDPOINT
              value: alloy.logging.svc:9090
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            grpc:
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            grpc:
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            initialDelaySeconds: 60
